name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - run: pnpm ci
      - run: pnpm run check
      - run: pnpm run build
